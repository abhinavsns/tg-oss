name: Bun Tests
on: [push, pull_request]
jobs:
  bun-test:
    name: Run bun tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Run tests
        run: bun test
