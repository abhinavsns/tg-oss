name: Cypress tests

on: [push, pull_request]

jobs:
  cypress-run:
    name: ${{ matrix.project }} browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [ui, ove]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run browser tests
        run: yarn nx run ${{ matrix.project }}:e2e --browser electron
